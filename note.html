<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Note App</title>
    <link rel="stylesheet" href="note.css">
</head>
<body>
        <header>
            <h1 class="h1-atr">Note App</h1>
        </header>

        <main>
    <div class="form-section">
        <input type="text" id="note-title" placeholder="Note Title">
        <br>
        <textarea id="notes" placeholder="Write your notes here..."></textarea>
        <br>
        <button type="button" id="save-button">Save Note</button>
        <button type="button" id="clear-notes-button">Clear Notes</button>
    </div>

    <div id="notes-list"></div>
</main>

    <script src="note.js" defer></script>
</body>
</html>
